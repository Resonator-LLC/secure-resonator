[project]
name = "secure-resonator"
version = "0.1.0"
description = "Tailored security advisories and approved, agent-applied updates for your infrastructure"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "authlib>=1.3",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "packaging>=24",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["secure"]

[tool.setuptools.package-data]
secure = ["*.sql"]
